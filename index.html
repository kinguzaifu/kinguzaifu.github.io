<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSEUDEAD - Games Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="header-title">ANUNCIADOS:</h1>
  </header>
  <main class="xbox-showcase">
    <section class="game-featured">
      <div class="poster-container">
        <img src="poster.png" alt="Poster PSEUDEAD" class="game-poster">
        <span class="badge-status">NOVO</span>
      </div>
      <div class="game-info">
        <h2 class="game-title">PSEUDEAD</h2>
        <div class="tags">
          <span class="tag">Top-down Shooter</span>
          <span class="tag">Roguelike</span>
          <span class="tag">Ação</span>
        </div>
        <p class="game-description">
          Mateus, um homem comum do campo, tem sua família ameaçada por nazistas e decide embarcar em uma jornada brutal a fim de se vingar! Enfrente hordas implacáveis em combates frenéticos.
        </p>
        <div class="action-area">
          <button class="btn-primary">Ver Trailer / Saiba Mais</button>
        </div>
      </div>

    </section>
  </main>

</body>
</html>
